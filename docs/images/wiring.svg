<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
<rect width="1180" height="720" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#1f2421">Net2RF LED: wiring</text>
<text x="24" y="56" fill="#6a716c">WT32-ETH01 + CC1101 (433 MHz). A Ra-02 uses the same pins (box at lower right). Everything below the dashed line is optional.</text>
<rect x="250" y="80" width="240" height="570" rx="10" fill="#f6f8f5" stroke="#9aa39d" stroke-width="1.5"/>
<text x="370.0" y="104" text-anchor="middle" font-weight="700" font-size="15" fill="#1f2421">WT32-ETH01</text>
<text x="370.0" y="122" text-anchor="middle" fill="#6a716c" font-size="12">ESP32 + LAN8720 Ethernet</text>
<rect x="800" y="80" width="210" height="240" rx="10" fill="#f6f8f5" stroke="#9aa39d" stroke-width="1.5"/>
<text x="996" y="104" text-anchor="end" font-weight="700" font-size="15" fill="#1f2421">CC1101</text>
<text x="996" y="122" text-anchor="end" fill="#6a716c" font-size="12">433 MHz module</text>
<rect x="800" y="395" width="210" height="100" rx="10" fill="#f6f8f5" stroke="#9aa39d" stroke-width="1.5"/>
<text x="996" y="419" text-anchor="end" font-weight="700" font-size="15" fill="#1f2421">SSD1306 OLED</text>
<text x="996" y="437" text-anchor="end" fill="#6a716c" font-size="12">128×64 I²C</text>
<text x="812" y="484" fill="#6a716c" font-size="12">VCC → 3V3, GND → GND</text>
<line x1="980" y1="80" x2="980" y2="62" stroke="#37474f" stroke-width="2"/><path d="M970,62 L980,44 L990,62" fill="none" stroke="#37474f" stroke-width="2"/><text x="964" y="58" text-anchor="end" fill="#6a716c" font-size="12">SMA antenna</text>
<line x1="490" y1="372" x2="1160" y2="372" stroke="#c7ccc6" stroke-dasharray="6 5"/>
<text x="1156" y="390" text-anchor="end" fill="#8a918b" font-size="12">optional</text>
<text x="478" y="114" text-anchor="end" font-weight="600" fill="#1f2421">3V3</text>
<circle cx="490" cy="110" r="4" fill="#d32f2f"/>
<line x1="490" y1="110" x2="800" y2="110" stroke="#d32f2f" stroke-width="3" stroke-linecap="round"/>
<circle cx="800" cy="110" r="4" fill="#d32f2f"/>
<text x="812" y="114" fill="#1f2421">VCC</text>
<text x="645.0" y="104" text-anchor="middle" fill="#d32f2f" font-size="11">3.3 V</text>
<text x="478" y="144" text-anchor="end" font-weight="600" fill="#1f2421">GND</text>
<circle cx="490" cy="140" r="4" fill="#37474f"/>
<line x1="490" y1="140" x2="800" y2="140" stroke="#37474f" stroke-width="3" stroke-linecap="round"/>
<circle cx="800" cy="140" r="4" fill="#37474f"/>
<text x="812" y="144" fill="#1f2421">GND</text>
<text x="645.0" y="134" text-anchor="middle" fill="#37474f" font-size="11">GND</text>
<text x="478" y="184" text-anchor="end" font-weight="600" fill="#1f2421">IO14</text>
<circle cx="490" cy="180" r="4" fill="#1e88e5"/>
<line x1="490" y1="180" x2="800" y2="180" stroke="#1e88e5" stroke-width="3" stroke-linecap="round"/>
<circle cx="800" cy="180" r="4" fill="#1e88e5"/>
<text x="812" y="184" fill="#1f2421">SCK</text>
<text x="645.0" y="174" text-anchor="middle" fill="#1e88e5" font-size="11">SCK</text>
<text x="478" y="214" text-anchor="end" font-weight="600" fill="#1f2421">IO15</text>
<circle cx="490" cy="210" r="4" fill="#43a047"/>
<line x1="490" y1="210" x2="800" y2="210" stroke="#43a047" stroke-width="3" stroke-linecap="round"/>
<circle cx="800" cy="210" r="4" fill="#43a047"/>
<text x="812" y="214" fill="#1f2421">MOSI (SI)</text>
<text x="645.0" y="204" text-anchor="middle" fill="#43a047" font-size="11">MOSI</text>
<text x="478" y="244" text-anchor="end" font-weight="600" fill="#1f2421">IO35</text>
<circle cx="490" cy="240" r="4" fill="#fb8c00"/>
<line x1="490" y1="240" x2="800" y2="240" stroke="#fb8c00" stroke-width="3" stroke-linecap="round"/>
<circle cx="800" cy="240" r="4" fill="#fb8c00"/>
<text x="812" y="244" fill="#1f2421">MISO (SO)</text>
<text x="645.0" y="234" text-anchor="middle" fill="#fb8c00" font-size="11">MISO</text>
<text x="478" y="274" text-anchor="end" font-weight="600" fill="#1f2421">IO4</text>
<circle cx="490" cy="270" r="4" fill="#8e24aa"/>
<line x1="490" y1="270" x2="800" y2="270" stroke="#8e24aa" stroke-width="3" stroke-linecap="round"/>
<circle cx="800" cy="270" r="4" fill="#8e24aa"/>
<text x="812" y="274" fill="#1f2421">CSN</text>
<text x="645.0" y="264" text-anchor="middle" fill="#8e24aa" font-size="11">CS</text>
<text x="478" y="304" text-anchor="end" font-weight="600" fill="#1f2421">IO33</text>
<circle cx="490" cy="300" r="4" fill="#00897b"/>
<line x1="490" y1="300" x2="800" y2="300" stroke="#00897b" stroke-width="3" stroke-linecap="round"/>
<circle cx="800" cy="300" r="4" fill="#00897b"/>
<text x="812" y="304" fill="#1f2421">GDO0 (data in)</text>
<text x="645.0" y="294" text-anchor="middle" fill="#00897b" font-size="11">OOK data</text>
<text x="478" y="344" text-anchor="end" font-weight="600" fill="#1f2421">IO32</text>
<circle cx="490" cy="340" r="4" fill="#6d4c41"/>
<line x1="490" y1="340" x2="550" y2="340" stroke="#6d4c41" stroke-width="3" stroke-linecap="round"/>
<text x="560" y="344" fill="#1f2421">RESET: Ra-02 only</text>
<text x="478" y="424" text-anchor="end" font-weight="600" fill="#1f2421">IO5</text>
<circle cx="490" cy="420" r="4" fill="#3949ab"/>
<line x1="490" y1="420" x2="800" y2="420" stroke="#3949ab" stroke-width="3" stroke-linecap="round"/>
<circle cx="800" cy="420" r="4" fill="#3949ab"/>
<text x="812" y="424" fill="#1f2421">SDA</text>
<text x="645.0" y="414" text-anchor="middle" fill="#3949ab" font-size="11">SDA</text>
<text x="478" y="454" text-anchor="end" font-weight="600" fill="#1f2421">IO17</text>
<circle cx="490" cy="450" r="4" fill="#5e35b1"/>
<line x1="490" y1="450" x2="800" y2="450" stroke="#5e35b1" stroke-width="3" stroke-linecap="round"/>
<circle cx="800" cy="450" r="4" fill="#5e35b1"/>
<text x="812" y="454" fill="#1f2421">SCL</text>
<text x="645.0" y="444" text-anchor="middle" fill="#5e35b1" font-size="11">SCL</text>
<text x="478" y="514" text-anchor="end" font-weight="600" fill="#1f2421">IO39</text>
<circle cx="490" cy="510" r="4" fill="#607d8b"/>
<line x1="490" y1="510" x2="550" y2="510" stroke="#607d8b" stroke-width="3" stroke-linecap="round"/>
<text x="560" y="514" fill="#1f2421">user button to GND + 10 kΩ pull-up to 3V3</text>
<text x="478" y="554" text-anchor="end" font-weight="600" fill="#1f2421">EN</text>
<circle cx="490" cy="550" r="4" fill="#607d8b"/>
<line x1="490" y1="550" x2="550" y2="550" stroke="#607d8b" stroke-width="3" stroke-linecap="round"/>
<text x="560" y="554" fill="#1f2421">RESET button to GND</text>
<text x="478" y="584" text-anchor="end" font-weight="600" fill="#1f2421">IO0</text>
<circle cx="490" cy="580" r="4" fill="#607d8b"/>
<line x1="490" y1="580" x2="550" y2="580" stroke="#607d8b" stroke-width="3" stroke-linecap="round"/>
<text x="560" y="584" fill="#1f2421">BOOT button to GND (press only while resetting)</text>
<text x="262" y="114" font-weight="600" fill="#1f2421">5V</text>
<circle cx="250" cy="110" r="4" fill="#d32f2f"/>
<line x1="250" y1="110" x2="180" y2="110" stroke="#d32f2f" stroke-width="3" stroke-linecap="round"/>
<text x="172" y="114" text-anchor="end" fill="#1f2421">5 V / 1 A supply</text>
<text x="262" y="144" font-weight="600" fill="#1f2421">GND</text>
<circle cx="250" cy="140" r="4" fill="#37474f"/>
<line x1="250" y1="140" x2="180" y2="140" stroke="#37474f" stroke-width="3" stroke-linecap="round"/>
<text x="172" y="144" text-anchor="end" fill="#1f2421">supply GND</text>
<text x="262" y="204" font-weight="600" fill="#1f2421">TX0 (IO1)</text>
<circle cx="250" cy="200" r="4" fill="#c2185b"/>
<line x1="250" y1="200" x2="180" y2="200" stroke="#c2185b" stroke-width="3" stroke-linecap="round"/>
<text x="172" y="204" text-anchor="end" fill="#1f2421">adapter RX</text>
<text x="262" y="234" font-weight="600" fill="#1f2421">RX0 (IO3)</text>
<circle cx="250" cy="230" r="4" fill="#c2185b"/>
<line x1="250" y1="230" x2="180" y2="230" stroke="#c2185b" stroke-width="3" stroke-linecap="round"/>
<text x="172" y="234" text-anchor="end" fill="#1f2421">adapter TX</text>
<text x="262" y="264" font-weight="600" fill="#1f2421">GND</text>
<circle cx="250" cy="260" r="4" fill="#37474f"/>
<line x1="250" y1="260" x2="180" y2="260" stroke="#37474f" stroke-width="3" stroke-linecap="round"/>
<text x="172" y="264" text-anchor="end" fill="#1f2421">adapter GND</text>
<text x="172" y="292" text-anchor="end" fill="#6a716c" font-size="12">3.3 V USB-serial adapter,</text>
<text x="172" y="308" text-anchor="end" fill="#6a716c" font-size="12">first flash only</text>
<rect x="870" y="530" width="290" height="160" rx="10" fill="#fff8e6" stroke="#e0b44a" stroke-width="1.5"/>
<text x="884" y="554" fill="#1f2421"><tspan font-weight='700'>Ra-02 (SX1278) instead of CC1101</tspan></text>
<text x="884" y="574" fill="#1f2421">Same pins: SCK, MOSI, MISO,</text>
<text x="884" y="594" fill="#1f2421">NSS on IO4 (in place of CSN)</text>
<text x="884" y="614" fill="#1f2421">DIO2 → IO33 (in place of GDO0)</text>
<text x="884" y="634" fill="#1f2421">RESET → IO32</text>
<text x="884" y="654" fill="#1f2421">433 MHz antenna on the u.FL jack</text>
<text x="884" y="674" fill="#1f2421">Select it under Bracelets &amp; Radio</text>
<text x="24" y="704" fill="#8a918b" font-size="12">Power the radio and the OLED from 3V3 (not 5 V). Fit only one radio: both share the SPI bus and chip select.</text>
</svg>