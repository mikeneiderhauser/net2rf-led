; Net2RF LED - WT32-ETH01 firmware
; xLights --DDP--> ESP32 --> CC1101 / SX1278 (Ra-02) --433 MHz--> LED wristbands, sticks, pucks

[platformio]
default_envs = wt32-eth01
; Optional per-machine overrides (git-ignored), e.g. to keep .pio out of a synced folder.
; See platformio_local.ini.example.
extra_configs = platformio_local*.ini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

[env:wt32-eth01]
board = wt32-eth01
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=3
build_src_flags = -Wall -Wextra
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
extra_scripts =
    pre:tools/version.py
    pre:tools/embed_ui.py
    post:tools/merge_factory.py

; Host-side unit tests (encoder, input parsers, radio register math, heartbeat): `pio test -e native`
[env:native]
platform = native
framework =
build_flags = -std=gnu++17
lib_deps =
    throwtheswitch/Unity@^2.6.0
    bblanchon/ArduinoJson@^7.2.0
test_framework = unity
