; Net2RF LED firmware
; xLights --DDP--> ESP32 --> CC1101 / SX1278 (Ra-02) --433 MHz--> LED wristbands, sticks, pucks
; Boards: wt32-eth01 (Ethernet + Wi-Fi) and xiao-esp32s3 (Wi-Fi only). Pin maps: src/pins.h

[platformio]
default_envs = wt32-eth01
; Optional per-machine overrides (git-ignored), e.g. to keep .pio out of a synced folder.
; See platformio_local.ini.example.
extra_configs = platformio_local*.ini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

[env:wt32-eth01]
board = wt32-eth01
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=3
build_src_flags = -Wall -Wextra
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
extra_scripts =
    pre:tools/version.py
    pre:tools/embed_ui.py
    post:tools/merge_factory.py

; Seeed XIAO ESP32-S3 + CC1101, wired as in CrispyPyro/Wireless_DMX_Receiver (docs/ASSEMBLY.md). Wi-Fi only.
[env:xiao-esp32s3]
board = seeed_xiao_esp32s3
board_build.partitions = min_spiffs.csv  ; same OTA slot size as the WT32-ETH01
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DNET2RF_BOARD_XIAO_S3
build_src_flags = ${env:wt32-eth01.build_src_flags}
lib_deps = ${env:wt32-eth01.lib_deps}
extra_scripts = ${env:wt32-eth01.extra_scripts}

; Host-side unit tests (encoder, input parsers, radio register math, heartbeat): `pio test -e native`
[env:native]
platform = native
framework =
build_flags = -std=gnu++17
lib_deps =
    throwtheswitch/Unity@^2.6.0
    bblanchon/ArduinoJson@^7.2.0
test_framework = unity
